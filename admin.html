<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後臺管理 - 單品咖啡</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#cfa968">
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="stylesheet" href="style.css?v=19">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Admin Dashboard 專用樣式 */
        .admin-container {
            display: flex;
            height: calc(100vh - 60px); /* 扣掉 topbar 高度 */
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        .admin-sidebar {
            width: 300px;
            background-color: #1a1a1a;
            border-right: 1px solid #333;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .admin-sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            background-color: #1a1a1a;
            z-index: 10;
        }

        .user-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .user-item {
            padding: 15px 20px;
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .user-item:hover {
            background-color: #2a2a2a;
        }

        .user-item.active {
            background-color: #2a2a2a;
            border-left: 4px solid var(--accent-gold);
        }

        .user-name {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: #f5f5f5; /* 更亮的顏色 */
        }

        .user-email {
            font-size: 0.85rem;
            color: #bbb; /* 更亮的顏色 */
        }

        .admin-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .admin-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
            text-align: center;
        }

        .user-profile-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .user-profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            background-color: var(--accent-gold);
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .user-info h2 {
            margin: 0 0 5px 0;
            color: var(--accent-gold);
        }

        .user-info p {
            margin: 0;
            color: #aaa;
            font-size: 0.95rem;
        }

        .reviews-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .review-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .review-card {
                flex-direction: column;
            }
        }

        .review-details {
            flex: 1;
        }

        .review-chart {
            width: 250px;
            height: 250px;
            flex-shrink: 0;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px dashed #333;
            padding-bottom: 10px;
        }

        .review-coffee-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .review-date {
            font-size: 0.85rem;
            color: #666;
        }

        .review-text {
            color: #ddd;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .review-score-badge {
            background: var(--accent-gold);
            color: #000;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            display: inline-block;
        }
        
        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--accent-gold);
        }
    </style>
</head>

<body>
    <nav class="topbar" style="display: flex; flex-wrap: nowrap; justify-content: space-between; align-items: center; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div class="logo">CR <span style="font-size: 0.8rem; color: #fff; margin-left: 8px;">ADMIN</span></div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <button onclick="window.location.href='index.html'" class="btn-outline" style="white-space: nowrap;">返回前臺</button>
        </div>
    </nav>

    <div class="admin-container">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-header">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3 style="margin: 0; color: var(--accent-gold);" id="sidebar-title">會員與回報列表</h3>
                    <select id="view-selector" style="background:#333; color:#fff; border:1px solid #555; border-radius:4px; padding:2px 5px; outline:none; font-size:0.85rem;">
                        <option value="users">會員列表</option>
                        <option value="suggestions">回報與建議</option>
                    </select>
                </div>
                <p style="margin: 5px 0 0 0; font-size: 0.85rem; color: #888;">共 <span id="user-count">0</span> 筆</p>
            </div>
            <div id="users-loading" class="loading-spinner">載入中...</div>
            <ul id="user-list" class="user-list">
                <!-- 動態載入會員 -->
            </ul>
            <ul id="suggestion-list" class="user-list" style="display: none;">
                <!-- 動態載入建議 -->
            </ul>
        </aside>

        <main class="admin-content" id="admin-content">
            <div class="admin-empty-state" id="empty-state">
                <svg viewBox="0 0 24 24" width="64" height="64" stroke="var(--accent-gold)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 20px;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <h2 style="color: var(--text-main);">請選擇左側會員</h2>
                <p>點擊會員以查看其詳細資料與所有的風味評論紀錄。</p>
            </div>

            <div id="user-details-view" style="display: none;">
                <div class="user-profile-card">
                    <div class="user-profile-header">
                        <div class="user-avatar" id="detail-avatar">U</div>
                        <div class="user-info">
                            <h2 id="detail-name">User Name</h2>
                            <p id="detail-email">email@example.com</p>
                            <p id="detail-phone" style="margin-top: 5px;">Phone: 0900000000</p>
                        </div>
                    </div>
                </div>

                <h3 style="color: var(--accent-gold); border-left: 3px solid var(--accent-gold); padding-left: 10px; margin-bottom: 20px;">
                    歷史評論 (<span id="review-count">0</span>)
                </h3>
                
                <div id="reviews-loading" class="loading-spinner" style="display: none;">載入評論中...</div>
                <div id="reviews-container" class="reviews-container">
                    <!-- 動態載入評論與雷達圖 -->
                </div>
            </div>

            <div id="suggestion-details-view" style="display: none;">
                <div class="user-profile-card">
                    <div class="user-profile-header" style="align-items: flex-start;">
                        <div class="user-info" style="width: 100%;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                                <h2 id="sug-coffee-name" style="margin:0;">Coffee Name</h2>
                                <span id="sug-status-badge" style="background:#555; color:#fff; padding:4px 8px; border-radius:12px; font-size:0.85rem;">待處理</span>
                            </div>
                            <p style="color:#aaa; font-size:0.9rem; margin-bottom:15px;">回報人：<span id="sug-user" style="color:#fff;">User</span> ｜ 時間：<span id="sug-date">Date</span></p>
                            
                            <h4 style="color:var(--accent-gold); margin-bottom:5px;">回報內容 / 建議</h4>
                            <div id="sug-text" style="background:#222; padding:15px; border-radius:8px; color:#ddd; line-height:1.6; min-height:80px; margin-bottom:20px;"></div>
                            
                            <div style="display:flex; gap:10px;">
                                <button id="btn-sug-approve" class="btn-submit" style="background:#28a745; border-color:#28a745; color:#fff;">標示為「已處理」</button>
                                <button id="btn-sug-reject" class="btn-outline" style="border-color:#dc3545; color:#dc3545;">標示為「駁回」</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase -->
    <script type="module" src="firebase-db.js?v=2"></script>
    <script type="module" src="admin.js?v=3"></script>
</body>

</html>
